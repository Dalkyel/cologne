<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cologne Advisor · Pereira</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface-2: #1e1e1e;
      --surface-warm: #1a1810;
      --surface-green: #101810;
      --border: #2a2a2a;
      --border-warm: #3a3020;
      --border-green: #1e3020;
      --gold: #c8a96e;
      --gold-dim: #6a5530;
      --green: #4a8a5a;
      --green-dim: #243420;
      --text: #e8e0d4;
      --text-dim: #888880;
      --text-faint: #484844;
      --red: #d05050;
      --blue: #6090b8;
      --orange: #c07840;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      line-height: 1.4;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ── Header ─────────────────────────────── */
    header {
      padding: 52px 0 36px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }

    .header-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 30px;
      font-weight: 300;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .header-sub {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 6px;
    }

    /* ── Weather card ───────────────────────── */
    .weather-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 36px;
    }

    .weather-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .w-stat { text-align: center; }

    .w-stat .val {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1;
    }

    .w-stat .val sup {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-dim);
      vertical-align: super;
    }

    .w-stat .lbl {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-top: 5px;
    }

    .weather-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-dim);
    }

    .weather-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--gold);
    }

    .weather-dot.rain { background: var(--blue); }

    .weather-updated {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-faint);
    }

    /* ── Section headings ───────────────────── */
    .section-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    /* ── Recommendation cards ───────────────── */
    .reco-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }

    .reco-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .reco-card.top-pick {
      background: var(--surface-warm);
      border-color: var(--gold-dim);
    }

    .reco-main { flex: 1; min-width: 0; }

    .reco-name {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 1px;
    }

    .reco-house {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .reco-spray {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .reco-verdict {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.55;
    }

    .reco-score {
      text-align: right;
      flex-shrink: 0;
    }

    .reco-score .num {
      font-size: 26px;
      font-weight: 200;
      letter-spacing: -0.04em;
      color: var(--gold);
      line-height: 1;
    }

    .reco-score .denom {
      font-size: 11px;
      color: var(--text-faint);
    }

    .reco-score .conc {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-top: 4px;
    }

    /* ── Tip ────────────────────────────────── */
    .tip-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold-dim);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* ── Avoid ──────────────────────────────── */
    .avoid-row {
      margin-bottom: 40px;
    }

    .avoid-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 10px;
    }

    .avoid-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .avoid-tag {
      background: #180e0e;
      border: 1px solid #321a1a;
      color: #b06060;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12px;
    }

    /* ── Divider ────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 0 36px;
    }

    /* ── Layering section ───────────────────── */
    .layer-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .layer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .layer-card.featured {
      background: var(--surface-green);
      border-color: var(--border-green);
    }

    .layer-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px 14px;
    }

    .layer-name {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    .layer-frags {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .layer-pill {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .layer-pill .conc {
      color: var(--text-faint);
      font-size: 10px;
      margin-left: 3px;
    }

    .layer-plus {
      font-size: 13px;
      color: var(--text-faint);
      font-weight: 300;
    }

    .layer-score-block {
      text-align: right;
      flex-shrink: 0;
    }

    .layer-score {
      font-size: 22px;
      font-weight: 200;
      letter-spacing: -0.04em;
      color: var(--green);
      line-height: 1;
    }

    .layer-score span {
      font-size: 10px;
      color: var(--text-faint);
    }

    .layer-body {
      padding: 14px 20px 18px;
      border-top: 1px solid var(--border);
    }

    .layer-context-chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      margin-bottom: 10px;
    }

    .layer-ratio {
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
      margin-bottom: 5px;
      letter-spacing: 0.01em;
      line-height: 1.5;
    }

    .layer-order {
      font-size: 11px;
      color: var(--text-faint);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .layer-result {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .layer-pereira {
      font-size: 12px;
      color: var(--text-faint);
      font-style: italic;
      line-height: 1.5;
    }

    /* ── All combos toggle ──────────────────── */
    .all-layers-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-dim);
      user-select: none;
      transition: background 0.12s;
      margin-bottom: 0;
    }

    .all-layers-btn:hover { background: var(--surface-2); }

    .all-layers-btn .chevron {
      font-size: 11px;
      color: var(--text-faint);
      transition: transform 0.2s ease;
    }

    .all-layers-btn.open .chevron { transform: rotate(180deg); }

    .all-layers-body {
      display: none;
      padding-top: 10px;
    }

    .all-layers-btn.open + .all-layers-body { display: block; }

    /* ── Never layer ────────────────────────── */
    .never-layer {
      margin-top: 10px;
      background: #130a0a;
      border: 1px solid #281212;
      border-radius: 10px;
      padding: 16px 18px;
    }

    .never-layer-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 12px;
    }

    .never-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 12px;
      padding: 8px 0;
      border-bottom: 1px solid #1e0e0e;
      align-items: baseline;
    }

    .never-item:last-child { border-bottom: none; padding-bottom: 0; }

    .never-names {
      font-size: 12px;
      font-weight: 600;
      color: #904040;
      white-space: nowrap;
    }

    .never-reason {
      font-size: 12px;
      color: #583030;
      line-height: 1.5;
    }

    /* ── Collection ─────────────────────────── */
    .collection {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .frag-row {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s ease;
      user-select: none;
    }

    .frag-row:last-child { border-bottom: none; }
    .frag-row:hover { background: var(--surface-2); }

    .frag-row-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
    }

    .tier {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .tier-S { background: #221a08; color: #c8a96e; border: 1px solid #5a4020; }
    .tier-A { background: #0e1820; color: #7090b0; border: 1px solid #2a4060; }
    .tier-B { background: #1c1408; color: #c07840; border: 1px solid #503010; }
    .tier-C { background: #141414; color: #686860; border: 1px solid #282828; }
    .tier-D { background: #180e0e; color: #a04040; border: 1px solid #381818; }

    .frag-info { flex: 1; min-width: 0; }

    .frag-name {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .frag-house {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 1px;
    }

    .frag-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }

    .frag-rating {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: -0.03em;
      color: var(--text-dim);
    }

    .frag-rating span { font-size: 11px; color: var(--text-faint); }

    .frag-conc {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .frag-chevron {
      color: var(--text-faint);
      font-size: 12px;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .frag-row.open .frag-chevron { transform: rotate(180deg); }

    .frag-detail {
      display: none;
      padding: 0 20px 20px 64px;
      border-top: 1px solid var(--border);
    }

    .frag-row.open .frag-detail { display: block; }

    .frag-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      margin: 14px 0 14px;
    }

    .notes-table {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 5px 12px;
      margin-bottom: 14px;
    }

    .note-lbl {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-faint);
      padding-top: 2px;
    }

    .note-val {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .frag-verdict-text {
      font-size: 13px;
      font-style: italic;
      color: var(--text);
      line-height: 1.55;
      margin-bottom: 10px;
    }

    .frag-spray-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--gold);
      line-height: 1.5;
    }

    /* ── States ─────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 10px;
      height: 140px;
      margin-bottom: 36px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .error-card {
      background: #180e0e;
      border: 1px solid #321a1a;
      border-radius: 12px;
      padding: 20px;
      color: #b06060;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    /* ── Tips ───────────────────────────────── */
    .placement-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 24px;
    }

    .placement-item {
      display: grid;
      grid-template-columns: 10px 1fr auto;
      gap: 10px 12px;
      align-items: start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .placement-item.avoid {
      opacity: 0.6;
    }

    .placement-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-top: 4px;
      flex-shrink: 0;
    }

    .placement-dot.avoid {
      background: none;
      border: 1.5px solid var(--text-faint);
    }

    .placement-zone {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px;
    }

    .placement-why {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .placement-best {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      text-align: right;
      white-space: nowrap;
      padding-top: 3px;
    }

    .tips-sub {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 20px 0 10px;
    }

    .spray-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .spray-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .spray-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 5px;
    }

    .spray-count {
      font-size: 24px;
      font-weight: 300;
      color: var(--gold);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 4px;
    }

    .spray-note {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .rules-list {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .rule-item {
      background: var(--surface);
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }

    .rule-item:last-child { border-bottom: none; }

    .rule-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 3px;
    }

    .rule-body {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* ── Location ───────────────────────────── */
    .location-refresh {
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 15px;
      padding: 0 0 0 5px;
      vertical-align: middle;
      line-height: 1;
      transition: color 0.2s;
    }
    .location-refresh:hover { color: var(--gold); }

    .away-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-warm);
      border: 1px solid var(--border-warm);
      border-radius: 4px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      margin-left: 8px;
    }

    .alt-note {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      line-height: 1.5;
    }

    /* ── Responsive ─────────────────────────── */
    @media (max-width: 480px) {
      .weather-stats { grid-template-columns: repeat(2, 1fr); }
      .header-title { font-size: 26px; }
      .frag-detail { padding-left: 20px; }
      .layer-frags { gap: 5px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-eyebrow">Cologne Advisor</div>
    <div class="header-title">What to wear today</div>
    <div class="header-sub">Live weather · <span id="location-name">detecting…</span><button class="location-refresh" onclick="refresh()" title="Refresh location">↻</button></div>
  </header>

  <div id="weather-zone"><div class="skeleton"></div></div>
  <div id="reco-zone"></div>
  <div id="layering-zone"></div>
  <div id="tips-zone"></div>
  <div id="collection-zone"></div>

</div>

  {

/* ─── Weather helpers ─────────────────────────────────────── */
const WX_LABELS = [
  [0,  0,  'Clear sky',        false],
  [1,  1,  'Mainly clear',     false],
  [2,  2,  'Partly cloudy',    false],
  [3,  3,  'Overcast',         false],
  [45, 48, 'Foggy',            false],
  [51, 55, 'Drizzle',          true],
  [56, 57, 'Freezing drizzle', true],
  [61, 65, 'Rain',             true],
  [71, 77, 'Snow',             false],
  [80, 82, 'Rain showers',     true],
  [85, 86, 'Snow showers',     false],
  [95, 99, 'Thunderstorm',     true],
];

function wxInfo(code) {
  for (const [lo, hi, label, rain] of WX_LABELS) {
    if (code >= lo && code <= hi) return { label, rain };
  }
  return { label: 'Variable', rain: false };
}

function fmtTime(iso) {
  const d = new Date(iso + ':00');
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

/* ─── Renderers ─────────────────────────────────────────── */
function renderWeather(w, loc) {
  const { label, rain } = wxInfo(w.weather_code);
  const uvStr   = w.uv_index != null ? Math.round(w.uv_index) : '—';
  const windStr = w.wind_speed_10m != null ? Math.round(w.wind_speed_10m) : '—';

  const roundedTemp     = Math.round(w.temperature_2m);
  const roundedApparent = w.apparent_temperature != null ? Math.round(w.apparent_temperature) : null;
  const feelsStr = (roundedApparent != null && Math.abs(roundedApparent - roundedTemp) >= 1)
    ? `<div class="lbl" style="font-size:10px;margin-top:3px;color:var(--text-faint)">feels ${roundedApparent}°</div>`
    : '';

  const altStr  = loc.altitude != null ? ` · ${loc.altitude}m` : '';
  const awayChip = loc.isHome ? '' : `<span class="away-chip">↗ Away</span>`;

  return `
    <div class="weather-card">
      <div class="weather-stats">
        <div class="w-stat">
          <div class="val">${roundedTemp}<sup>°C</sup></div>
          <div class="lbl">Temperature</div>
          ${feelsStr}
        </div>
        <div class="w-stat">
          <div class="val">${w.relative_humidity_2m}<sup>%</sup></div>
          <div class="lbl">Humidity</div>
        </div>
        <div class="w-stat">
          <div class="val">${windStr}</div>
          <div class="lbl">Wind km/h</div>
        </div>
        <div class="w-stat">
          <div class="val">${uvStr}</div>
          <div class="lbl">UV Index</div>
        </div>
      </div>
      <div class="weather-footer">
        <div class="weather-dot ${rain ? 'rain' : ''}"></div>
        <span>${label} · ${loc.name}${altStr}</span>
        ${awayChip}
        <span class="weather-updated">Updated ${fmtTime(w.time)}</span>
      </div>
    </div>
  `;
}

function renderReco(ctx, loc) {
  const cards = ctx.wear.map((id, i) => {
    const f = FRAGS.find(x => x.id === id);
    if (!f) return '';
    return `
      <div class="reco-card ${i === 0 ? 'top-pick' : ''}">
        <div class="reco-main">
          <div class="reco-name">${f.name}</div>
          <div class="reco-house">${f.house} · ${f.family}</div>
          <div class="reco-spray">${ctx.sprays[id] || f.spray}</div>
          <div class="reco-verdict">${f.verdict}</div>
        </div>
        <div class="reco-score">
          <div class="num">${f.rating}</div>
          <div class="denom">/10</div>
          <div class="conc">${f.conc}</div>
        </div>
      </div>
    `;
  }).join('');

  const avoidTags = ctx.avoid.map(id => {
    const f = FRAGS.find(x => x.id === id);
    return f ? `<div class="avoid-tag">${f.name}</div>` : '';
  }).join('');

  const altNote = altitudeNote(loc.altitude);
  const altHTML = altNote ? `<div class="alt-note">${altNote}</div>` : '';

  return `
    <div class="section-eyebrow">${ctx.label}</div>
    <div class="section-title">${ctx.title}</div>
    <div class="reco-stack">${cards}</div>
    <div class="tip-box">${ctx.tip}</div>
    ${altHTML}
    <div class="avoid-row">
      <div class="avoid-label">Skip today</div>
      <div class="avoid-tags">${avoidTags}</div>
    </div>
    <div class="divider"></div>
  `;
}

  const [a, b] = l.fragrances.map(id => FRAGS.find(f => f.id === id));
  return `
    <div class="layer-card ${featured ? 'featured' : ''}">
      <div class="layer-card-top">
        <div>
          <div class="layer-name">${l.name}</div>
          <div class="layer-frags">
            <div class="layer-pill">${a.name}<span class="conc">${a.conc}</span></div>
            <div class="layer-plus">+</div>
            <div class="layer-pill">${b.name}<span class="conc">${b.conc}</span></div>

        <div class="layer-score-block">
          <div class="layer-score">${l.rating}<span>/10</span></div>
        </div>
      </div>
      <div class="layer-body">
        <div class="layer-context-chip">${l.contextLabel}</div>

}

function renderLayering(contextId) {
  const featured = LAYERINGS.filter(l => l.contexts.includes(contextId));
  const rest     = LAYERINGS.filter(l => !l.contexts.includes(contextId));

  const featuredHTML = featured.map(l => layerCard(l, true)).join('');
  const restHTML     = rest.map(l => layerCard(l, false)).join('');

  const neverHTML = NEVER_LAYER.map(n => `
    <div class="never-item">
      <div class="never-names">${n.names}</div>
      <div class="never-reason">${n.reason}</div>
    </div>
  `).join('');

  const allCount = LAYERINGS.length;
  const restCount = rest.length;

  return `
    <div class="section-eyebrow">Layering</div>
    <div class="section-title">Today's combos for your collection</div>
    <div class="layer-stack">${featuredHTML}</div>

    <div class="all-layers-btn" id="all-layers-btn" onclick="toggleAllLayers()">

}

    { title: "Don't rub your wrists together",          body: "Friction accelerates evaporation of top notes and skips the opening. Spray from 5–6 inches, let it air-dry." },
    { title: "Don't spray a cloud and walk through it", body: "Most mist evaporates in the air before reaching skin. Spray directly onto skin from 5–6 inches away." },
    { title: "Fabric outlasts skin",                    body: "Natural fibers hold fragrance 24–48 hrs vs 2–8 hrs on skin. One collar spray outlasts two wrist applications." },
    { title: "Moisturize before applying",              body: "Dry skin retains fragrance poorly. Unscented lotion before spraying extends longevity noticeably." },
    { title: "You go nose-blind in 15–20 min",          body: "Your brain stops detecting your own scent — others still can. Don't compensate by adding more sprays." },
    { title: "Store away from the bathroom",            body: "Heat and humidity degrade cologne 30% faster. Cool, dark drawer or closet shelf preserves quality." },
  ];

  const placementHTML = placements.map(p => `
    <div class="placement-item ${p.avoid ? 'avoid' : ''}">
      <div class="placement-dot ${p.avoid ? 'avoid' : ''}"></div>
      <div>
        <div class="placement-zone">${p.zone}</div>
        <div class="placement-why">${p.why}</div>
      </div>
      <div class="placement-best">${p.best}</div>
    </div>
  `).join('');

  const sprayHTML = sprays.map(s => `
    <div class="spray-item">
      <div class="spray-label">${s.label}</div>
      <div class="spray-count">${s.count}</div>
      <div class="spray-note">${s.note}</div>
    </div>
  `).join('');

  const rulesHTML = rules.map(r => `
    <div class="rule-item">
      <div class="rule-title">${r.title}</div>
      <div class="rule-body">${r.body}</div>
    </div>
  `).join('');

  return `
    <div class="section-eyebrow">Application</div>
    <div class="section-title">How to wear</div>

    <div class="tips-sub">Placement — best to worst</div>
    <div class="placement-list">${placementHTML}</div>

    <div class="tips-sub">Sprays by occasion</div>
    <div class="spray-grid">${sprayHTML}</div>

    <div class="tips-sub">Six rules</div>
    <div class="rules-list">${rulesHTML}</div>

    <div class="divider"></div>
  `;
}

/* ─── Location ───────────────────────────────────────────── */
const HOME = { lat: 4.8143, lon: -75.6946, altitude: 1411 };

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

async function reverseGeocode(lat, lon) {
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`,
      { headers: { 'Accept-Language': 'en' } }
    );
    const d = await res.json();
    const city = d.address?.city || d.address?.town || d.address?.village || d.address?.county || 'Unknown';
    const cc   = (d.address?.country_code || '').toUpperCase();
    return cc ? `${city} · ${cc}` : city;
  } catch {
    return `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
  }
}

async function getAltitude(lat, lon) {
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`);
    const d = await res.json();
    return Math.round(d.elevation?.[0] ?? 0);
  } catch {
    return null;
  }
}

async function detectLocation() {
  return new Promise(resolve => {
    const fallback = { lat: HOME.lat, lon: HOME.lon, name: 'Pereira · CO', isHome: true, altitude: HOME.altitude };
    if (!navigator.geolocation) { resolve(fallback); return; }

    navigator.geolocation.getCurrentPosition(
      async pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        const isHome = haversineKm(lat, lon, HOME.lat, HOME.lon) < 5;
        if (isHome) {
          resolve({ lat, lon, name: 'Pereira · CO', isHome: true, altitude: HOME.altitude });
          return;
        }
        const [name, altitude] = await Promise.all([reverseGeocode(lat, lon), getAltitude(lat, lon)]);
        resolve({ lat, lon, name, isHome: false, altitude });
      },
      () => resolve(fallback),
      { timeout: 8000 }
    );
  });
}

function altitudeNote(alt) {
  if (alt == null) return '';
  if (alt < 500)  return `${alt}m — sea-level. Performance guides apply as written.`;
  if (alt < 1000) return `${alt}m — mild altitude effect. Top notes fade ~10% faster than at sea level.`;
  if (alt < 1500) return `${alt}m — similar to Pereira. Top notes burn 15–20 min faster. +1 phantom spray for EDTs. Apply on damp skin.`;
  if (alt < 2500) return `${alt}m — significant altitude. EDPs strongly preferred over EDTs. Apply on damp skin, add 1–2 sprays vs sea-level guides.`;
  return `${alt}m — high altitude. Fragrance evaporates aggressively. EDP only. Spray on damp skin; double your usual count.`;
}

/* ─── Data fetch ─────────────────────────────────────────── */
async function loadWeather(lat, lon) {
  const url =
    'https://api.open-meteo.com/v1/forecast' +
    `?latitude=${lat}&longitude=${lon}` +
    '&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,apparent_temperature,wind_speed_10m' +
    '&hourly=uv_index' +
    '&timezone=auto' +
    '&forecast_days=1';

  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();

  const cur  = data.current;
  const hour = parseInt(cur.time.split('T')[1].split(':')[0], 10);
  cur.uv_index = data.hourly?.uv_index?.[hour] ?? null;
  cur._hour    = hour;
  return cur;
}

/* ─── Init ───────────────────────────────────────────────── */
async function init() {
  const weatherZone  = document.getElementById('weather-zone');
  const recoZone     = document.getElementById('reco-zone');
  const layeringZone = document.getElementById('layering-zone');
  const collZone     = document.getElementById('collection-zone');

  try {
    const loc = await detectLocation();
    document.getElementById('location-name').textContent = loc.name;

    const w = await loadWeather(loc.lat, loc.lon);
    const conditions = {
      temp:     w.temperature_2m,
      apparent: w.apparent_temperature ?? w.temperature_2m,
      humidity: w.relative_humidity_2m,
      rain:     w.weather_code >= 51,
      hour:     w._hour,
      wind:     w.wind_speed_10m ?? 0,
      month:    new Date().getMonth() + 1,
    };

    const ctx = CONTEXTS.find(c => c.match(conditions));

    weatherZone.innerHTML  = renderWeather(w, loc);
    recoZone.innerHTML     = renderReco(ctx, loc);
    layeringZone.innerHTML = renderLayering(ctx.id);
    document.getElementById('tips-zone').innerHTML = renderTips();
    collZone.innerHTML     = renderCollection();

  } catch (err) {
    document.getElementById('location-name').textContent = 'Pereira · CO';
    weatherZone.innerHTML = `
      <div class="error-card">
        Could not load weather data (${err.message}).<br>
        Check your internet connection and reload the page.
      </div>
    `;
    layeringZone.innerHTML = renderLayering('afternoon');
    document.getElementById('tips-zone').innerHTML = renderTips();
    collZone.innerHTML     = renderCollection();
  }
}

function refresh() {
  document.getElementById('location-name').textContent = 'detecting…';
  document.getElementById('weather-zone').innerHTML = '<div class="skeleton"></div>';
  document.getElementById('reco-zone').innerHTML = '';
  document.getElementById('layering-zone').innerHTML = '';
  document.getElementById('tips-zone').innerHTML = '';
  init();
}

init();
